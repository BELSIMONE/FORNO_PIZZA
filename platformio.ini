; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 9600
board_build.filesystem = littlefs
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.3
    adafruit/MAX6675 library@^1.1.2
    bblanchon/ArduinoJson@^7.2.0

; ---------------------------------------------------------------------------
; Ambiente per il primo flash via USB (cavo seriale)
; ---------------------------------------------------------------------------
[env:usb]
upload_protocol = esptool
upload_speed = 921600

; ---------------------------------------------------------------------------
; Ambiente per gli aggiornamenti successivi via OTA (WiFi)
; IP del forno: aggiornare se cambia (vedi mDNS "mio-esp32.local" in alternativa)
; ---------------------------------------------------------------------------
[env:ota]
upload_protocol = espota
upload_port = 192.168.1.163
; upload_port = mio-esp32.local   ; alternativa via mDNS, piu' robusta se l'IP cambia
